<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Sign Studio</title>
<meta name="description" content="Design and align hanging family welcome signs: preview the layout, let the customer adjust it, and send the shop a finished spec.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sign Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" as="font" type="font/woff2" href="fonts/figtree-latin-600-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/bricolage-grotesque-latin-700-normal.woff2" crossorigin>
<style>
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/figtree-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/bricolage-grotesque-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/bricolage-grotesque-latin-700-normal.woff2") format("woff2"); }
/* Layout idea: tool rail left (setup, members, auto-layout), working canvas centre, inspector and checks right. */
:root {
  --ink: #1b2336;
  --ink2: #566079;
  --paper: #f2f3f7;
  --panel: #ffffff;
  --line: #dde1ea;
  --acc: #2f56c4;
  --acc-soft: #e6ecfb;
  --gold: #c58f21;
  --err: #d0343f;
  --warn: #c97d0b;
  --ok: #1b8657;
  --stage: #e8ebf1;
  --f-d: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-b: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.4 var(--f-b); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font: 700 17px/1.1 var(--f-d); display: block; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--ink2); }
.top .seg button { padding: 5px 10px; }
#btnInstall { border-color: var(--acc); color: var(--acc); }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; color: var(--ink2); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(20,30,60,.16); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn:hover { border-color: #b9c1d3; background: #fafbfd; }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn.primary:hover { background: #2548a8; }
.btn.ghost { background: transparent; }
.btn.wide { width: 100%; padding: 9px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg, .ibtn svg { width: 16px; height: 16px; flex: none; }
.ibtn { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; display: inline-grid; place-items: center; padding: 0; }
.ibtn:hover { border-color: #b9c1d3; background: #fafbfd; }
.ibtn:disabled { opacity: .35; cursor: default; }

/* main */
.main { display: grid; grid-template-columns: 322px minmax(0, 1fr) 296px; min-height: 0; }
.panel { overflow-y: auto; background: var(--panel); min-height: 0; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.sec { border-bottom: 1px solid var(--line); }
.sec > summary { list-style: none; cursor: pointer; padding: 11px 16px; font: 700 13px var(--f-d); letter-spacing: .02em; text-transform: uppercase; color: var(--ink2); display: flex; align-items: center; gap: 8px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(45deg); transition: transform .15s; }
.sec[open] > summary::after { transform: rotate(-135deg); }
.sec .body { padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.count { background: var(--acc-soft); color: var(--acc); border-radius: 99px; padding: 0 8px; font: 700 12px var(--f-b); letter-spacing: 0; }
.row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.row > .btn { flex: 1 1 120px; }
.fld { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink2); font-weight: 600; flex: 1 1 80px; min-width: 70px; }
.body > .fld, .mbody > .fld { flex: none; }
.fld input, .fld select, .txt { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
.chk { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 13px; }
.chk input { width: 16px; height: 16px; accent-color: var(--acc); }
.hint { margin: 0; font-size: 12px; color: var(--ink2); }
.note { background: var(--acc-soft); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; color: #24367a; }

/* members */
.memlist { display: flex; flex-direction: column; gap: 6px; }
.mem { border: 1px solid var(--line); border-radius: 9px; padding: 7px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; background: #fff; }
.mem.sel { border-color: var(--acc); background: var(--acc-soft); }
.mem .th { grid-row: span 2; position: relative; width: 38px; height: 46px; padding: 0; border: 0; border-radius: 5px; background: repeating-conic-gradient(#f1f2f6 0 25%, #fff 0 50%) 0 0 / 10px 10px; }
.mem .th img { width: 100%; height: 100%; object-fit: contain; display: block; }
.mem .th .cam { position: absolute; right: -5px; bottom: -5px; width: 17px; height: 17px; border-radius: 99px; background: var(--acc); color: #fff; display: grid; place-items: center; border: 2px solid #fff; }
.mem .th .cam svg { width: 9px; height: 9px; }
.mem.drop, .stage.dropping { outline: 2px dashed var(--acc); outline-offset: -3px; background: var(--acc-soft); }
.cnt { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.stepper button { width: 34px; height: 34px; border: 0; background: var(--paper); font: 700 18px/1 var(--f-b); }
.stepper button:hover:not(:disabled) { background: var(--acc-soft); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper input { width: 54px; height: 34px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 0; text-align: center; font-weight: 700; -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.mem .nm { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 6px; font-weight: 700; width: 100%; min-width: 0; }
.mem .nm:hover, .mem .nm:focus { border-color: var(--line); background: #fff; }
.mem .mb { display: flex; gap: 2px; }
.mem .mb button { width: 24px; height: 24px; border: 0; background: none; border-radius: 6px; display: grid; place-items: center; color: var(--ink2); padding: 0; }
.mem .mb button:hover { background: rgba(30,50,100,.1); }
.mem .mb svg { width: 14px; height: 14px; }
.mem .mm { grid-column: 2 / 4; display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--ink2); font-weight: 600; }
.mem .mm select { border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; background: #fff; min-width: 0; flex: 1; max-width: 130px; font-size: 12px; }
.mem .mm select.g { flex: none; max-width: 52px; }

/* layout chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: #9fb0e0; }
.chip[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.lbl { font-size: 12px; font-weight: 700; color: var(--ink2); }
#layBody[data-lm="rows"] .lm-gen, #layBody[data-lm="rows"] .lm-tree,
#layBody[data-lm="gen"] .lm-rows, #layBody[data-lm="gen"] .lm-tree,
#layBody[data-lm="tree"] .lm-rows, #layBody[data-lm="tree"] .lm-gen,
#layBody[data-lm="tree"] .lm-place { display: none !important; }

/* stage */
.stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; }
.stage canvas { display: block; touch-action: none; }
.tools { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: 0 4px 14px rgba(20,30,60,.14); max-width: calc(100% - 20px); overflow-x: auto; }
.tools .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
.tools button { width: 32px; height: 32px; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; padding: 0; }
.tools button:hover:not(:disabled) { background: var(--acc-soft); }
.tools button:disabled { opacity: .3; cursor: default; }
.tools svg { width: 18px; height: 18px; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: 0 4px 14px rgba(20,30,60,.12); }
.zoom button { height: 28px; min-width: 28px; border: 0; background: none; border-radius: 7px; font-weight: 700; padding: 0 6px; }
.zoom button:hover { background: var(--acc-soft); }
.zoom span { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink2); }
.stbar { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; box-shadow: 0 4px 14px rgba(20,30,60,.12); flex-wrap: wrap; max-width: calc(100% - 190px); }
.stbar .chk { font-size: 12.5px; }
.stbar .chk input { width: 15px; height: 15px; }
.pill { display: inline-block; border-radius: 99px; padding: 1px 9px; font-size: 11.5px; font-weight: 700; }
.pill.demo { position: absolute; left: 12px; top: 12px; background: var(--gold); color: #fff; padding: 3px 11px; }

/* inspector, checks, specs */
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--paper); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font: 700 17px var(--f-d); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--ink2); font-weight: 600; }
.iss { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 7px 9px; font-size: 12.5px; background: #fff; text-align: left; width: 100%; }
.iss:hover { background: #fafbfd; }
.iss.err { border-left-color: var(--err); } .iss.warn { border-left-color: var(--warn); } .iss.info { border-left-color: var(--acc); }
.iss b { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; flex: none; width: 46px; padding-top: 1px; }
.iss.err b { color: var(--err); } .iss.warn b { color: var(--warn); } .iss.info b { color: var(--acc); }
.okbox { border: 1px solid #bfe3d1; background: #eef9f3; color: #14653f; border-radius: 8px; padding: 9px 11px; font-weight: 600; font-size: 12.5px; }
.badge { border-radius: 99px; padding: 0 8px; font: 700 12px var(--f-b); letter-spacing: 0; }
.badge.err { background: #fbe4e6; color: var(--err); } .badge.warn { background: #fcefd6; color: var(--warn); } .badge.ok { background: #dff3e8; color: var(--ok); }
.cust-only { display: none; }
.app[data-mode="customer"] .shop-only { display: none !important; }
.app[data-mode="customer"] .cust-only { display: flex; }
.app[data-mode="shop"] .cust-btn { display: none; }
.app[data-mode="customer"] .shop-btn { display: none; }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(20,28,48,.5); display: grid; place-items: center; padding: 16px; z-index: 50; }
.mcard { background: var(--panel); border-radius: 14px; width: min(640px, 100%); max-height: 92%; overflow: auto; box-shadow: 0 20px 60px rgba(10,20,50,.35); }
.mcard > header { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.mcard h2 { margin: 0; font: 700 18px var(--f-d); flex: 1; }
.mbody { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.mbody img.pv { max-width: 100%; max-height: 260px; object-fit: contain; align-self: center; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.dlrow { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.dlrow div { flex: 1; min-width: 0; } .dlrow b { display: block; } .dlrow small { color: var(--ink2); }
.dlrow .btn { flex: none; }
textarea.txt { min-height: 110px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1b2336; color: #fff; padding: 9px 16px; border-radius: 10px; font-weight: 600; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100% - 32px); }

@media (max-width: 1020px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; overflow-y: auto; }
  .stage { order: -1; height: 62vh; min-height: 380px; }
  .panel { overflow: visible; border: 0 !important; }
  .stbar { max-width: calc(100% - 20px); bottom: 48px; }
}
@media (max-width: 640px) {
  .top { gap: 8px; padding: 6px 10px; }
  .brand { margin-right: 0; } .brand span { display: none; }
  .spacer { display: none; }
  .top .btn { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<div class="app" id="app" data-mode="shop">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="3" width="28" height="12" rx="4" fill="#2f56c4"/><rect x="2" y="3" width="28" height="12" rx="4" fill="none" stroke="#c58f21" stroke-width="1.6"/><g fill="#8b929c"><circle cx="9" cy="17.5" r="1"/><circle cx="9" cy="20.5" r="1"/><circle cx="16" cy="17.5" r="1"/><circle cx="16" cy="20.5" r="1"/><circle cx="23" cy="17.5" r="1"/><circle cx="23" cy="20.5" r="1"/></g><rect x="5.5" y="22.5" width="7" height="7" rx="3" fill="#c58f21"/><rect x="12.5" y="22.5" width="7" height="7" rx="3" fill="#d0343f"/><rect x="19.5" y="22.5" width="7" height="7" rx="3" fill="#1b8657"/></svg>
      <div><b>Family Sign Studio</b><span data-i18n="brandSub"></span></div>
    </div>
    <div class="seg" role="group" data-i18n-aria="modeLbl" aria-label="Mode">
      <button type="button" id="modeShop" aria-pressed="true">Shop</button>
      <button type="button" id="modeCust" aria-pressed="false">Customer</button>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" id="langSeg" data-i18n-aria="langLbl" aria-label="Wika">
      <button type="button" data-lang="tl" aria-pressed="true" title="Taglish">Taglish</button>
      <button type="button" data-lang="en" aria-pressed="false" title="English">English</button>
    </div>
    <button type="button" class="btn" id="btnInstall" hidden><span data-ic="install"></span><span data-i18n="btnInstall"></span></button>
    <button type="button" class="ibtn" id="btnUndo" data-ic="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
    <button type="button" class="ibtn" id="btnRedo" data-ic="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
    <button type="button" class="btn" id="btnOpen"><span data-ic="open"></span><span data-i18n="btnOpen"></span></button>
    <button type="button" class="btn primary shop-btn" id="btnExport"><span data-ic="export"></span><span data-i18n="btnExport"></span></button>
    <button type="button" class="btn primary cust-btn" id="btnSend"><span data-ic="send"></span><span data-i18n="btnSend"></span></button>
  </header>

  <div class="main">
    <aside class="panel left" id="left">
      <div class="sec cust-only" style="padding:14px 16px;flex-direction:column;gap:10px">
        <div class="note" data-i18n-html="custNote"></div>
        <button type="button" class="btn" id="btnRevert" data-i18n="btnRevert"></button>
      </div>

      <details class="sec shop-only" open>
        <summary data-i18n="secSetup"></summary>
        <div class="body">
          <div class="row">
            <button type="button" class="btn" id="btnBoard" data-i18n="btnBoard"></button>
            <button type="button" class="btn" id="btnBlank" data-i18n="btnBlank"></button>
          </div>
          <div class="row">
            <label class="fld" for="boardW"><span data-i18n="boardW"></span><input id="boardW" type="number" min="5" max="150" step="0.5" value="30"></label>
            <label class="fld" for="boardH"><span data-i18n="boardH"></span><input id="boardH" type="number" min="5" max="150" step="0.5" value="21"></label>
          </div>
          <label class="fld" for="boardPreset"><span data-i18n="presetLbl"></span>
            <select id="boardPreset">
              <option value="" data-i18n="presetCustom"></option>
              <option value="20x15">20 × 15 cm</option><option value="25x18">25 × 18 cm</option><option value="30x20">30 × 20 cm</option><option value="30x21">30 × 21 cm</option>
              <option value="40x30">40 × 30 cm</option><option value="50x35">50 × 35 cm</option><option value="60x40">60 × 40 cm</option>
            </select></label>
          <label class="chk" id="lockWrap"><input type="checkbox" id="boardLock"> <span data-i18n="lockRatio"></span></label>
          <p class="hint" id="cardHint" hidden></p>
          <label class="fld" id="titleWrap" for="cardTitle"><span data-i18n="cardTitleLbl"></span><input id="cardTitle" class="txt" maxlength="28" data-i18n-ph="cardTitlePh" placeholder=""></label>
          <button type="button" class="btn" id="btnSheet" data-i18n="btnSheet"></button>
          <label class="chk"><input type="checkbox" id="optOutline" checked> <span data-i18n="optOutline"></span></label>
          <p class="hint" data-i18n="hintUpload"></p>
          <div class="row">
            <button type="button" class="btn ghost" id="btnDemo" data-i18n="btnDemo"></button>
            <button type="button" class="btn ghost" id="btnNew" data-i18n="btnNew"></button>
          </div>
        </div>
      </details>

      <details class="sec" open>
        <summary><span data-i18n="secMembers"></span> <span class="count" id="memCount">0</span></summary>
        <div class="body">
          <div class="cnt">
            <span class="lbl" data-i18n="countLbl"></span>
            <div class="stepper">
              <button type="button" id="cntMinus" data-i18n-aria="countMinus" aria-label="">−</button>
              <input id="memN" type="number" min="0" max="20" step="1" inputmode="numeric" data-i18n-aria="countLbl" aria-label="">
              <button type="button" id="cntPlus" data-i18n-aria="countPlus" aria-label="">+</button>
            </div>
          </div>
          <p class="hint" data-i18n="countHint"></p>
          <label class="chk shop-only"><input type="checkbox" id="lockCount"> <span data-i18n="lockCountLbl"></span></label>
          <label class="fld" for="imgMode"><span data-i18n="imgModeLbl"></span>
            <select id="imgMode"><option value="auto" data-i18n="imgAuto"></option><option value="cut" data-i18n="imgCut"></option><option value="photo" data-i18n="imgPhoto"></option></select></label>
          <button type="button" class="btn" id="btnFigs"><span data-ic="upload"></span><span data-i18n="btnUploadPics"></span></button>
          <p class="hint" data-i18n="hintUploadPics"></p>
          <div class="memlist" id="memList"></div>
          <p class="hint" data-i18n="hintMembers"></p></div>
      </details>

      <details class="sec" open>
        <summary data-i18n="secLayout"></summary>

    const fx0 = Math.max(0, Math.floor(c.x0 / s) - 8), fy0 = Math.max(0, Math.floor(c.y0 / s) - 8);
    const fx1 = Math.min(W, Math.ceil((c.x1 + 1) / s) + 8), fy1 = Math.min(H, Math.ceil((c.y1 + 1) / s) + 8);
    const cw = fx1 - fx0, ch = fy1 - fy0, oc = mkCanvas(cw, ch), ox = oc.getContext('2d', { willReadFrequently: true });
    ox.drawImage(canvas, fx0, fy0, cw, ch, 0, 0, cw, ch);
    const id = ox.getImageData(0, 0, cw, ch), dd = id.data;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const lx = Math.min(sw - 1, ((fx0 + x) * s) | 0), ly = Math.min(sh - 1, ((fy0 + y) * s) | 0);
      if (lab[ly * sw + lx] !== c.id) dd[(y * cw + x) * 4 + 3] = 0;
    }
    ox.putImageData(id, 0, 0);
    outs.push({ canvas: oc, cx: (c.x0 + c.x1) / 2, cy: (c.y0 + c.y1) / 2, h: c.y1 - c.y0 });
  }
  outs.sort((a, b) => a.cy - b.cy);
  const rows = [];
  for (const o of outs) {
    const row = rows.find(r2 => Math.abs(r2.cy - o.cy) < Math.min(r2.h, o.h) * 0.45);
    if (row) { row.items.push(o); row.cy = row.items.reduce((t, i) => t + i.cy, 0) / row.items.length; row.h = Math.max(row.h, o.h); }
    else rows.push({ cy: o.cy, h: o.h, items: [o] });
  }
  rows.sort((a, b) => a.cy - b.cy);
  return rows.flatMap(r2 => r2.items.sort((a, b) => a.cx - b.cx)).map(o => o.canvas);
}

  const nm = slug(S.meta.customer);
  if (key === 'preview') return canvasBlob(renderExport({ k: 70 })).then(b => saveBlob(`sign-preview-${nm}.png`, b));
  if (key === 'sheet') return canvasBlob(renderSheet()).then(b => saveBlob(`sign-specs-${nm}.png`, b));
  if (key === 'projCust') return saveBlob(`sign-for-customer-${nm}.json`, new Blob([serialize('customer')], { type: 'application/json' }));
  if (key === 'projShop') return saveBlob(`sign-project-${nm}.json`, new Blob([serialize('shop')], { type: 'application/json' }));
  if (key === 'projSend') return saveBlob(`sign-from-customer-${nm}.json`, new Blob([serialize('shop')], { type: 'application/json' }));
  if (key === 'copy') {
    const t = specText(); const ta = $('#specTa'); if (ta) { ta.value = t; ta.hidden = false; ta.select(); }
    try { return navigator.clipboard.writeText(t).then(() => toast(tr('copied')), () => toast(tr('copyManual'))); } catch (e) { toast(tr('copyManual')); }
  }
}
function bindModal(root) {
  root.addEventListener('click', e => { const b = e.target.closest('[data-dl]'); if (b) doDl(b.dataset.dl); });
  const n = $('#mCust', root), t = $('#mNote', root);
  if (n) n.addEventListener('input', () => { S.meta.customer = n.value; });
  if (t) t.addEventListener('input', () => { S.meta.note = t.value; });
}
function exportModal() {
  computeChecks(); const bad = S.issues.filter(i => i.lvl === 'err').length;
  openModal(tr('exportTitle'), `
    ${bad ? `<div class="iss err" style="cursor:default"><b>${tr('lvlErr')}</b><span>${tr('exportBad', { n: bad })}</span></div>` : ''}
    <label class="fld" for="mCust">${tr('custName')}<input id="mCust" class="txt" value="${esc(S.meta.customer)}" placeholder="${tr('custNamePh')}"></label>
    <label class="fld" for="mNote">${tr('noteProd')}<input id="mNote" class="txt" value="${esc(S.meta.note)}" placeholder="${tr('noteProdPh')}"></label>
    ${dlRow('preview', tr('dlPreview'), tr('dlPreviewSub'))}
    ${dlRow('sheet', tr('dlSheet'), tr('dlSheetSub'))}
    ${dlRow('projCust', tr('dlProjCust'), tr('dlProjCustSub'))}
    ${dlRow('projShop', tr('dlProjShop'), tr('dlProjShopSub'))}
    ${dlRow('copy', tr('dlCopy'), tr('dlCopySub'), tr('copyBtn'))}
    <textarea class="txt" id="specTa" hidden readonly aria-label="${tr('specsAria')}"></textarea>
    <p class="hint">${tr('exportHint')}</p>`, bindModal);
}
function sendModal() {
  computeChecks(); const bad = S.issues.filter(i => i.lvl === 'err').length;
  const pv = renderExport({ k: 28, maxDim: 900 }).toDataURL('image/png');
  openModal(tr('sendTitle'), `
    ${bad ? `<div class="iss warn" style="cursor:default"><b>${tr('lvlWarn')}</b><span>${tr('sendBad', { n: bad })}</span></div>` : ''}
    <img class="pv" src="${pv}" alt="${tr('sendPvAlt')}">
    <label class="fld" for="mCust">${tr('yourName')}<input id="mCust" class="txt" value="${esc(S.meta.customer)}" placeholder="${tr('yourNamePh')}"></label>
    <label class="fld" for="mNote">${tr('noteShop')}<input id="mNote" class="txt" value="${esc(S.meta.note)}" placeholder="${tr('noteShopPh')}"></label>
    ${dlRow('projSend', tr('dlProjSend'), tr('dlProjSendSub'))}
    ${dlRow('preview', tr('dlPreviewMine'), tr('dlPreviewMineSub'))}
    ${dlRow('copy', tr('dlSummary'), tr('dlSummarySub'), tr('copyBtn'))}
    <textarea class="txt" id="specTa" hidden readonly aria-label="${tr('summaryAria')}"></textarea>
    <p class="hint">${tr('sendHint')}</p>`, bindModal);
}
function confirmModal(msg, yes) {
  openModal(tr('sure'), `<p style="margin:0">${msg}</p><div class="row"><button type="button" class="btn" id="cNo">${tr('no')}</button><button type="button" class="btn primary" id="cYes">${tr('yesGo')}</button></div>`, root => {
    $('#cNo', root).onclick = closeModal; $('#cYes', root).onclick = () => { closeModal(); yes(); };
  });
}
function refreshAfterLang(old) {
  if (isDemo()) S.members.forEach(m => { const i = DEMO_KEYS.findIndex(k => D[k][old === 'en' ? 1 : 0] === m.name); if (i >= 0) m.name = tr(DEMO_KEYS[i]); });
  closeModal(); refreshUI(); computeChecks(); renderChecks(); updateSpecs(); requestRender();
}

/* installable app + offline cache */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; const b = document.getElementById('btnInstall'); if (b) b.hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; const b = document.getElementById('btnInstall'); if (b) b.hidden = true; });
function installApp() {
  if (!installEvt) return; const e = installEvt; installEvt = null; $('#btnInstall').hidden = true;
  e.prompt(); if (e.userChoice) e.userChoice.catch(() => {});
}
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { toast(tr(had ? 'updated' : 'offlineReady'), had ? 9000 : 3500); });
  navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode is optional */ });
}

/* -------------------------------------------------------------------- init */
function init() {
  $$('[data-ic]').forEach(el => { el.innerHTML = IC[el.dataset.ic] || ''; });
  LANG = detectLang(); applyStaticLang();
  $$('#langSeg button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $('#btnInstall').onclick = installApp;
  cv = $('#cv'); cx = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement); COL.stage = cs.getPropertyValue('--stage').trim() || COL.stage; COL.acc = cs.getPropertyValue('--acc').trim() || COL.acc;
  resizeStage(); initPointer(); bindMembers(); bindLayout(); bindInspector(); bindChecks();
  new ResizeObserver(() => { resizeStage(); if (!S.view.moved) fitView(); }).observe(cv.parentElement);
  $('#modeShop').onclick = () => setMode('shop'); $('#modeCust').onclick = () => setMode('customer');
  $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
  $('#btnOpen').onclick = () => $('#fProject').click();
  $('#btnExport').onclick = exportModal; $('#btnSend').onclick = sendModal; $('#btnRevert').onclick = revertBase;
  $('#mClose').onclick = closeModal; $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  $('#btnBoard').onclick = () => $('#fBoard').click(); $('#btnFigs').onclick = () => $('#fFigs').click(); $('#btnSheet').onclick = () => $('#fSheet').click();
  $('#fBoard').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) addBoard(f); };
  $('#fFigs').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) addFigures(fs); };
  $('#fSheet').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) addSheet(f); };
  $('#fProject').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; await busy(tr('busyProject'), async () => loadProject(await f.text())); };
  $('#btnDemo').onclick = () => confirmModal(tr('confirmDemo'), () => { loadDemo(); dropDraft(); });
  $('#btnNew').onclick = () => confirmModal(tr('confirmNew'), newProject);
  $('#zIn').onclick = () => zoomAt(VW / 2, VH / 2, 1.25); $('#zOut').onclick = () => zoomAt(VW / 2, VH / 2, 0.8); $('#zFit').onclick = fitView;
  $('#tools').addEventListener('click', e => { const b = e.target.closest('button[data-al]'); if (b && !b.disabled) alignSel(b.dataset.al); });
  bindCardUI(); registerSW();
  restoreDraft().then(ok => { if (ok) toast(tr('draftRestored'), 3500); else loadDemo(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestRender());
  window.__app = { tr, setLang, setMemberCount, setBoardSize, useBlank, placeItems, phAsset, newProject, addFigures, customerLocked, saveDraft, restoreDraft, boardRect, MAXM, D, sizeOptions, S, computeChecks, layoutRows, layoutTree, autoLayout, assets, splitSheet, removeBg, trim, buildAsset, loadProject, serialize, renderSheet, renderExport, setMode, addSheet, addBoard, addFigures };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
